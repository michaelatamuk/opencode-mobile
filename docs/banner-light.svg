<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="OpenCode Mobile — your coding agent, in your pocket">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFCFF"/>
      <stop offset="0.55" stop-color="#EFF3FF"/>
      <stop offset="1" stop-color="#E5EBFF"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.86" cy="0.05" r="0.62">
      <stop offset="0" stop-color="#FFD8A8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD8A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.06" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#9DB2FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#9DB2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B59FF"/>
      <stop offset="1" stop-color="#7C9CFF"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F8FE"/>
    </linearGradient>
    <filter id="phone" x="-45%" y="-30%" width="190%" height="175%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#22336E" flood-opacity="0.2"/>
    </filter>
    <filter id="phone2" x="-45%" y="-30%" width="190%" height="175%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#22336E" flood-opacity="0.14"/>
    </filter>
    <clipPath id="frontScreen">
      <rect x="759" y="41" width="278" height="418" rx="34"/>
    </clipPath>
    <clipPath id="backScreen">
      <rect x="1017" y="69" width="232" height="362" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#warm)"/>
  <rect width="1280" height="420" fill="url(#cool)"/>

  <!-- brand mark -->
  <g transform="translate(88,88)" filter="url(#phone2)">
    <rect width="96" height="96" rx="26" fill="url(#mark)"/>
    <path d="M30,32 L48,48 L30,64" fill="none" stroke="#0E1226" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M55,64 H70" fill="none" stroke="#0E1226" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- copy -->
  <text x="88" y="256" font-family="Inter, 'Segoe UI', Roboto, -apple-system, system-ui, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#10142B">OpenCode <tspan fill="#3B59FF">Mobile</tspan></text>
  <text x="90" y="302" font-family="Inter, 'Segoe UI', Roboto, -apple-system, system-ui, sans-serif" font-size="26" font-weight="500" fill="#454D6B">Your coding agent, in your pocket.</text>
  <text x="90" y="338" font-family="Inter, 'Segoe UI', Roboto, -apple-system, system-ui, sans-serif" font-size="17" fill="#828AA3">Unofficial Android client for your self-hosted OpenCode server.</text>
  <text x="90" y="376" font-family="Inter, 'Segoe UI', Roboto, -apple-system, system-ui, sans-serif" font-size="14" letter-spacing="1.2" fill="#6E7BA8">FREE · OPEN SOURCE · NO ACCOUNTS · NO TELEMETRY</text>

  <!-- back phone: sessions -->
  <g transform="rotate(-7 1133 250)" filter="url(#phone2)">
    <rect x="1008" y="60" width="250" height="380" rx="38" fill="#12172B"/>
    <rect x="1017" y="69" width="232" height="362" rx="30" fill="#FBFCFE"/>
    <g clip-path="url(#backScreen)">
      <text x="1032" y="108" font-family="Inter, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#10142B">Sessions</text>
      <rect x="1032" y="118" width="58" height="6" rx="3" fill="#C9D0E2"/>
      <rect x="1026" y="140" width="214" height="58" rx="14" fill="#ECEFFF"/>
      <rect x="1038" y="154" width="96" height="9" rx="4.5" fill="#5A6FB8"/>
      <rect x="1038" y="172" width="132" height="7" rx="3.5" fill="#A9B4D8"/>
      <rect x="1188" y="154" width="40" height="7" rx="3.5" fill="#A9B4D8"/>
      <g fill="#D9DFEE">
        <rect x="1026" y="220" width="150" height="10" rx="5"/>
        <rect x="1026" y="240" width="108" height="7" rx="3.5"/>
        <rect x="1190" y="220" width="50" height="7" rx="3.5"/>
        <rect x="1026" y="286" width="176" height="10" rx="5"/>
        <rect x="1026" y="306" width="96" height="7" rx="3.5"/>
        <rect x="1190" y="286" width="50" height="7" rx="3.5"/>
        <rect x="1026" y="352" width="132" height="10" rx="5"/>
        <rect x="1026" y="372" width="120" height="7" rx="3.5"/>
        <rect x="1190" y="352" width="50" height="7" rx="3.5"/>
      </g>
      <rect x="1072" y="410" width="72" height="6" rx="3" fill="#D6DBE9"/>
    </g>
  </g>

  <!-- front phone: chat -->
  <g transform="rotate(2 898 250)" filter="url(#phone)">
    <rect x="748" y="30" width="300" height="440" rx="44" fill="#0E1324"/>
    <rect x="759" y="41" width="278" height="418" rx="34" fill="url(#screen)"/>
    <g clip-path="url(#frontScreen)">
      <g transform="translate(0,-20)">
      <text x="776" y="72" font-family="Inter, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#3A4160">9:41</text>
      <circle cx="1006" cy="68" r="2.4" fill="#8A92AB"/>
      <circle cx="1014" cy="68" r="2.4" fill="#8A92AB"/>
      <circle cx="1022" cy="68" r="2.4" fill="#8A92AB"/>

      <path d="M778,100 L786,108 L778,116" fill="none" stroke="#3D5CFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="796" y="105" font-family="Inter, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10142B">Checkout flow</text>
      <text x="796" y="120" font-family="Inter, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#828AA3">Build · DeepSeek V4</text>
      <circle cx="1020" cy="106" r="6" fill="none" stroke="#5B6480" stroke-width="1.6"/>
      <path d="M1024.5,110.5 L1029,115" stroke="#5B6480" stroke-width="1.6" stroke-linecap="round"/>
      <rect x="759" y="134" width="278" height="1" fill="#E7EAF2"/>

      <rect x="890" y="150" width="134" height="44" rx="16" fill="#E1E7FF"/>
      <text x="902" y="177" font-family="Inter, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#2A3360">Fix the flaky test</text>

      <rect x="775" y="214" width="214" height="9" rx="4.5" fill="#C7CEDF"/>
      <rect x="775" y="231" width="238" height="9" rx="4.5" fill="#C7CEDF"/>
      <rect x="775" y="248" width="162" height="9" rx="4.5" fill="#C7CEDF"/>

      <rect x="772" y="276" width="252" height="38" rx="12" fill="#F0F2F8"/>
      <rect x="784" y="289" width="3" height="12" rx="1.5" fill="#3D5CFF"/>
      <rect x="791" y="286" width="3" height="18" rx="1.5" fill="#3D5CFF"/>
      <rect x="798" y="291" width="3" height="8" rx="1.5" fill="#3D5CFF"/>
      <text x="812" y="299" font-family="Inter, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#4C5470">Working 12s · Shell</text>
      <path d="M1004,292 L1009,297 L1014,292" fill="none" stroke="#828AA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="775" y="330" width="196" height="9" rx="4.5" fill="#C7CEDF"/>
      <rect x="775" y="347" width="150" height="9" rx="4.5" fill="#C7CEDF"/>

      <circle cx="781" cy="372" r="3" fill="#7C9CFF"/>
      <circle cx="791" cy="372" r="3" fill="#9DB0F0"/>
      <circle cx="801" cy="372" r="3" fill="#C3CDF3"/>
      <text x="812" y="376" font-family="Inter, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#828AA3">Working</text>

      <rect x="770" y="394" width="256" height="44" rx="22" fill="#ECEFF7"/>
      <path d="M790,408 V424 M782,416 H798" stroke="#5B6480" stroke-width="2" stroke-linecap="round"/>
      <text x="808" y="421" font-family="Inter, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8A90A6">Steer the run…</text>
      <circle cx="1006" cy="416" r="17" fill="#3D5CFF"/>
      <rect x="1001" y="411" width="10" height="10" rx="2.5" fill="#FFFFFF"/>
      <rect x="884" y="448" width="68" height="5" rx="2.5" fill="#CCD2E2"/>
      </g>
    </g>
  </g>
</svg>
