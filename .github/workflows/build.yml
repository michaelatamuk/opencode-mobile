name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted runners already ship an Android SDK; make sure the
      # platform we compile against is present and licensed.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
              > /dev/null 2>&1 || true
          fi
          echo "SDK contents:"; ls "$SDK/platforms" || true

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          TAG="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk "opencode-mobile-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-apk
          path: opencode-mobile-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: opencode-mobile-*.apk
          generate_release_notes: true
