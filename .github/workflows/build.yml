name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted runners already ship an Android SDK; make sure the
      # platform we compile against is present and licensed.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK" > local.properties
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              "platform-tools" "platforms;android-35" "build-tools;35.0.0" \
              > /dev/null 2>&1 || true
          fi

      - name: Decode signing key
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/opencode.jks"

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build signed APK
        env:
          OPENCODE_KEYSTORE: ${{ runner.temp }}/opencode.jks
          OPENCODE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          OPENCODE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          OPENCODE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          TAG="${GITHUB_REF_NAME//\//-}"
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PappVersionCode="${{ github.run_number }}" \
            -PappVersionName="$TAG"

      - name: Collect APK
        run: |
          TAG="${GITHUB_REF_NAME//\//-}"
          cp app/build/outputs/apk/release/app-release.apk "opencode-mobile-${TAG}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-apk
          path: opencode-mobile-*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: opencode-mobile-*.apk
          generate_release_notes: true
