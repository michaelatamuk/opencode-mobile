name: Feature request
description: Suggest a capability for the Android client
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check the README’s **Limitations** first — some items (artifacts,
        true PTY, OAuth login) are blocked by the server, not the client.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow, not only the UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: input
    id: server
    attributes:
      label: Relevant OpenCode API/event
      description: If you know the endpoint or event name, add it.
    validations:
      required: false
